<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Калькулятор</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { background: #ffffff; }
  input, select, textarea, button { font-family: inherit; }

  /* Карточка выбора (чекбокс / переключатель) */
  .card { border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; cursor: pointer; }
  .card:has(input:checked) { border-color: #2563eb; box-shadow: inset 0 0 0 1px #2563eb; }
  .card:has(input:focus-visible) { outline: 2px solid #2563eb; outline-offset: 2px; }

  /* Переключатель */
  .sw { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .sw-track { position: relative; width: 44px; height: 24px; border-radius: 9999px; background: #94a3b8; flex-shrink: 0; transition: background .15s; }
  .sw-track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 9999px; background: #ffffff; transition: transform .15s; }
  .sw:checked + .sw-track { background: #2563eb; }
  .sw:checked + .sw-track::after { transform: translateX(20px); }

  /* Сегментированный выбор */
  .seg { display: flex; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; }
  .seg label { position: relative; flex: 1; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span.seg-item { display: block; height: 100%; padding: 10px 6px; text-align: center; font-size: 14px; line-height: 1.25; background: #ffffff; color: #0f172a; border-left: 1px solid #cbd5e1; cursor: pointer; }
  .seg label:first-child span.seg-item { border-left: 0; }
  .seg small { display: block; font-size: 12px; opacity: .75; margin-top: 2px; }
  .seg input:checked + span.seg-item { background: #2563eb; color: #ffffff; }
  .seg input:focus-visible + span.seg-item { outline: 2px solid #1d4ed8; outline-offset: -2px; }

  /* Убираем стрелки у number на всякий случай */
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
</style>
</head>
<body class="bg-white text-slate-900 antialiased">

<div id="app" class="max-w-md mx-auto px-4">
  <header class="pt-6 pb-4 border-b border-slate-300">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h1 id="appTitle" class="text-2xl font-bold leading-tight"></h1>
        <p id="appSubtitle" class="mt-1 text-sm text-slate-600"></p>
      </div>
      <button id="resetBtn" type="button" class="shrink-0 py-1 text-sm font-medium text-blue-600 hover:text-blue-700"></button>
    </div>
  </header>

  <form id="form" novalidate></form>

  <section class="py-5">
    <h2 id="calcTitle" class="text-lg font-semibold"></h2>
    <div id="calcBody" class="mt-3 border border-slate-300 rounded-lg p-3"></div>
  </section>

  <div id="spacer" style="height:140px"></div>
</div>

<!-- Нижняя панель -->
<div id="bar" class="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-slate-300">
  <div class="max-w-md mx-auto px-4 pt-3" style="padding-bottom: calc(env(safe-area-inset-bottom) + 12px);">
    <p id="msg" class="hidden mb-2 text-sm text-red-700" role="alert"></p>
    <div class="flex items-baseline justify-between">
      <span id="barLabel" class="text-sm text-slate-600"></span>
      <span id="barTotal" class="text-xl font-bold text-slate-900"></span>
    </div>
    <button id="genBtn" type="button" class="mt-2 w-full h-12 rounded-lg bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-base font-semibold focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 focus-visible:ring-offset-2"></button>
  </div>
</div>

<!-- Окно итогового документа -->
<div id="docModal" class="hidden fixed inset-0 z-50 bg-white flex-col" role="dialog" aria-modal="true" aria-labelledby="docHeading">
  <div class="w-full max-w-md mx-auto flex flex-col h-full">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-300">
      <h2 id="docHeading" class="text-lg font-semibold"></h2>
      <button id="docClose" type="button" class="py-1 text-sm font-medium text-blue-600 hover:text-blue-700"></button>
    </div>
    <div class="flex-1 overflow-y-auto px-4 py-4">
      <pre id="docText" class="whitespace-pre-wrap break-words font-mono text-sm leading-relaxed text-slate-900 border border-slate-300 rounded-lg p-4"></pre>
    </div>
    <div class="px-4 pt-3 border-t border-slate-300" style="padding-bottom: calc(env(safe-area-inset-bottom) + 12px);">
      <div class="flex gap-3">
        <button id="docCopy" type="button" class="flex-1 h-12 rounded-lg bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-base font-semibold"></button>
        <button id="docShare" type="button" class="hidden flex-1 h-12 rounded-lg bg-white border border-blue-600 text-blue-600 hover:bg-slate-50 text-base font-semibold"></button>
      </div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   APP_CONFIG — единственное место, которое нужно менять под задачу.

   Типы полей (field.type):
     text | tel | email | date | textarea
         Данные клиента / произвольный ввод.
         Параметры: id, label, placeholder, required, default, autocomplete
     checkbox
         Позиция с фиксированной ценой.
         Параметры: id, label, hint, price, default
     number
         Количество. Сумма = количество × price.
         Параметры: id, label, hint, price, unit, min, max, step, default
     select
         Выбор одного варианта. Каждая опция может влиять на итог:
           multiplier — коэффициент к сумме позиций (1.2 = +20%, 0.9 = -10%)
           add        — фиксированная сумма (положительная или отрицательная)
         Параметры: id, label, hint, options[{value,label,multiplier,add}],
                    ui: 'select' | 'segmented', default (value),
                    showNeutral (false — не показывать вариант без эффекта)
     switch
         Переключатель с тем же эффектом: multiplier и/или add.
         Параметры: id, label, hint, multiplier, add, default

   Правила расчёта:
     - База = сумма всех checkbox и number (количество × цена).
     - Коэффициенты (multiplier) считаются от базы и складываются, а не
       перемножаются друг на друга.
     - Если база равна нулю, корректировки не применяются.
     - id полей должны быть уникальными.
   ===================================================================== */
const APP_CONFIG = {
  storageKey: 'microutil_estimate_v1',
  title: 'Смета на отделочные работы',
  subtitle: 'Заполните данные и отметьте нужные работы. Итог считается автоматически.',
  currency: '₽',
  locale: 'ru-RU',

  minTotal: 3000,                                   // минимальная сумма заказа (0 — отключить)
  tax: { label: 'НДС', rate: 0, included: false }, // rate > 0 включает налог

  document: {
    title: 'СМЕТА',
    numberPrefix: 'С-',
    provider: ['Мастерская «Пример»', 'Тел.: +7 900 000-00-00'],
    intro: '',
    footer: ['Смета предварительная и действительна 14 дней.']
  },

  labels: {
    reset: 'Очистить',
    resetConfirm: 'Сбросить все введённые данные?',
    calcTitle: 'Расчёт',
    emptyCalc: 'Выберите работы или укажите объёмы — расчёт появится здесь.',
    total: 'Итого',
    base: 'Сумма позиций',
    adjustments: 'Условия и корректировки',
    minOrder: 'Доплата до минимальной суммы заказа',
    included: 'включён в сумму',
    generate: 'Сформировать итоговый документ',
    required: 'Обязательное поле',
    badPhone: 'Проверьте номер телефона',
    needItems: 'Выберите хотя бы одну работу или укажите объём.',
    fixErrors: 'Заполните обязательные поля.',
    docPreview: 'Итоговый документ',
    copy: 'Копировать',
    copied: 'Скопировано',
    copyFail: 'Не удалось скопировать',
    share: 'Поделиться',
    close: 'Закрыть',
    date: 'Дата',
    dec: 'Уменьшить',
    inc: 'Увеличить'
  },

  sections: [
    {
      id: 'client',
      title: 'Данные клиента',
      fields: [
        { id: 'clientName',  type: 'text',     label: 'Имя',                  placeholder: 'Иван Петров', required: true, autocomplete: 'name' },
        { id: 'clientPhone', type: 'tel',      label: 'Телефон',              placeholder: '+7 900 000-00-00', required: true },
        { id: 'objectAddr',  type: 'text',     label: 'Адрес объекта',        placeholder: 'Город, улица, дом, квартира', autocomplete: 'street-address' },
        { id: 'startDate',   type: 'date',     label: 'Желаемая дата начала' },
        { id: 'comment',     type: 'textarea', label: 'Комментарий',          placeholder: 'Пожелания, особенности объекта' }
      ]
    },
    {
      id: 'services',
      title: 'Работы',
      description: 'Отметьте нужные позиции с фиксированной стоимостью.',
      fields: [
        { id: 'measure', type: 'checkbox', label: 'Выезд мастера и замер',        price: 1500 },
        { id: 'demo',    type: 'checkbox', label: 'Демонтаж старых покрытий',     price: 8000 },
        { id: 'primer',  type: 'checkbox', label: 'Грунтование поверхностей',     price: 4500 },
        { id: 'plinth',  type: 'checkbox', label: 'Монтаж плинтусов и наличников', hint: 'По периметру помещения', price: 6000 }
      ]
    },
    {
      id: 'volumes',
      title: 'Объёмы',
      description: 'Укажите количество, стоимость считается за единицу.',
      fields: [
        { id: 'walls',    type: 'number', label: 'Шпаклёвка и покраска стен', unit: 'м²',  price: 450,  min: 0, step: 1 },
        { id: 'ceiling',  type: 'number', label: 'Покраска потолка',          unit: 'м²',  price: 380,  min: 0, step: 1 },
        { id: 'sockets',  type: 'number', label: 'Розетки и выключатели',     unit: 'шт',  price: 350,  min: 0, step: 1 },
        { id: 'hours',    type: 'number', label: 'Дополнительные работы',     hint: 'Почасовая оплата', unit: 'ч', price: 1200, min: 0, step: 0.5 }
      ]
    },
    {
      id: 'conditions',
      title: 'Условия',
      description: 'Коэффициенты считаются от суммы позиций.',
      fields: [
        {
          id: 'access', type: 'select', ui: 'segmented', label: 'Доступ к объекту', default: 'free',
          options: [
            { value: 'free',    label: 'Свободный', multiplier: 1 },
            { value: 'limited', label: 'Стеснённый', multiplier: 1.1 },
            { value: 'noelev',  label: 'Без лифта',  multiplier: 1.15 }
          ]
        },
        { id: 'urgent',  type: 'switch', label: 'Срочное выполнение', hint: 'Начало в течение 48 часов', multiplier: 1.25 },
        { id: 'garbage', type: 'switch', label: 'Вывоз строительного мусора', add: 3500 },
        {
          id: 'discount', type: 'select', ui: 'select', label: 'Скидка', default: 'none', showNeutral: false,
          options: [
            { value: 'none',    label: 'Без скидки',            multiplier: 1 },
            { value: 'regular', label: 'Постоянный клиент',     multiplier: 0.95 },
            { value: 'partner', label: 'Партнёрская программа', multiplier: 0.9 }
          ]
        }
      ]
    }
  ]
};

/* =====================================================================
   ДВИЖОК (менять не нужно)
   ===================================================================== */
(function () {
  'use strict';

  const CFG = APP_CONFIG;
  const L = CFG.labels;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
  const nf = new Intl.NumberFormat(CFG.locale || 'ru-RU', { maximumFractionDigits: 2 });
  const num = (n) => nf.format(n);
  const money = (n) => nf.format(n) + '\u00A0' + CFG.currency;
  const signed = (n) => (n < 0 ? '\u2212' : '+') + money(Math.abs(n));
  const pad = (n) => String(n).padStart(2, '0');

  const INFO_TYPES = ['text', 'tel', 'email', 'date', 'textarea'];
  const isInfo = (f) => INFO_TYPES.indexOf(f.type) !== -1;

  const FIELDS = {};
  CFG.sections.forEach((s) => s.fields.forEach((f) => { FIELDS[f.id] = f; }));

  /* ---------- Состояние и хранилище ---------- */
  function defaultValue(f) {
    switch (f.type) {
      case 'checkbox':
      case 'switch': return !!f.default;
      case 'number': return f.default ? String(f.default) : '';
      case 'select': return f.default != null ? String(f.default) : String(f.options[0].value);
      default: return f.default != null ? String(f.default) : '';
    }
  }

  function loadState() {
    const st = {};
    let saved = {};
    try {
      const raw = localStorage.getItem(CFG.storageKey);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && p.values && typeof p.values === 'object') saved = p.values;
      }
    } catch (e) { /* хранилище недоступно */ }
    Object.keys(FIELDS).forEach((id) => {
      const f = FIELDS[id];
      const def = defaultValue(f);
      const v = saved[id];
      if (f.type === 'checkbox' || f.type === 'switch') {
        st[id] = typeof v === 'boolean' ? v : def;
      } else if (f.type === 'select') {
        st[id] = f.options.some((o) => String(o.value) === v) ? v : def;
      } else {
        st[id] = typeof v === 'string' ? v : def;
      }
    });
    return st;
  }

  function saveState() {
    try { localStorage.setItem(CFG.storageKey, JSON.stringify({ values: state, savedAt: Date.now() })); } catch (e) { /* ignore */ }
  }

  let state = loadState();
  let els = {};

  /* ---------- Числа ---------- */
  function parseNum(s) {
    const n = parseFloat(String(s).replace(/\s/g, '').replace(',', '.'));
    return isFinite(n) ? n : 0;
  }
  function clampQty(f, n) {
    if (n <= 0) return 0;
    if (f.min != null && n < f.min) n = f.min;
    if (f.max != null && n > f.max) n = f.max;
    return n;
  }
  function qtyOf(f) { return clampQty(f, parseNum(state[f.id])); }

  /* ---------- Эффекты опций ---------- */
  function effectOf(o, base) {
    let a = 0;
    if (o.multiplier != null && o.multiplier !== 1) a += base * (o.multiplier - 1);
    if (o.add) a += o.add;
    return round2(a);
  }
  function effectText(o) {
    const p = [];
    if (o.multiplier != null && o.multiplier !== 1) {
      const pc = round2((o.multiplier - 1) * 100);
      p.push((pc > 0 ? '+' : '\u2212') + num(Math.abs(pc)) + '%');
    }
    if (o.add) p.push(signed(o.add));
    return p.join(', ');
  }

  /* ---------- Расчёт ---------- */
  function calculate() {
    const lines = [];
    const mods = [];
    let base = 0;

    CFG.sections.forEach((s) => s.fields.forEach((f) => {
      if (f.type === 'checkbox' && state[f.id]) {
        const a = round2(f.price || 0);
        base += a;
        lines.push({ section: s.id, label: f.label, detail: '', amount: a });
      } else if (f.type === 'number') {
        const q = qtyOf(f);
        if (q > 0 && f.price) {
          const a = round2(q * f.price);
          base += a;
          lines.push({
            section: s.id, label: f.label, amount: a,
            detail: num(q) + (f.unit ? '\u00A0' + f.unit : '') + ' \u00D7 ' + money(f.price)
          });
        }
      }
    }));

    base = round2(base);
    const active = base > 0;
    let sum = base;

    if (active) {
      CFG.sections.forEach((s) => s.fields.forEach((f) => {
        if (f.type === 'switch' && state[f.id]) {
          const a = effectOf(f, base);
          mods.push({ label: f.label, detail: effectText(f), amount: a });
          sum += a;
        } else if (f.type === 'select') {
          const o = f.options.find((x) => String(x.value) === state[f.id]);
          if (!o) return;
          const a = effectOf(o, base);
          if (a !== 0 || f.showNeutral !== false) {
            mods.push({ label: f.label + ': ' + o.label, detail: effectText(o), amount: a });
          }
          sum += a;
        }
      }));
      sum = round2(Math.max(0, sum));
      if (CFG.minTotal && sum < CFG.minTotal) {
        mods.push({ label: L.minOrder, detail: '', amount: round2(CFG.minTotal - sum) });
        sum = round2(CFG.minTotal);
      }
    }

    let tax = 0;
    let total = sum;
    const T = CFG.tax;
    if (active && T && T.rate > 0) {
      if (T.included) {
        tax = round2(sum * T.rate / (100 + T.rate));
      } else {
        tax = round2(sum * T.rate / 100);
        total = round2(sum + tax);
      }
    }
    return { lines, mods, base, sum, tax, total, active };
  }

  function taxLabel() {
    const T = CFG.tax;
    return T.label + ' (' + T.rate + '%)' + (T.included ? ' \u2014 ' + L.included : '');
  }

  /* ---------- Рендер формы ---------- */
  const INPUT_CLS = 'w-full h-12 px-3 rounded-lg border border-slate-300 bg-white text-base text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600';

  function labelHtml(f) {
    return esc(f.label) + (f.required ? ' <span class="text-blue-600">*</span>' : '');
  }
  function hintHtml(f) {
    return f.hint ? '<span class="block mt-0.5 text-sm text-slate-500">' + esc(f.hint) + '</span>' : '';
  }

  function renderField(f) {
    const id = esc(f.id);
    switch (f.type) {
      case 'text':
      case 'tel':
      case 'email':
      case 'date': {
        const ac = f.autocomplete || (f.type === 'tel' ? 'tel' : f.type === 'email' ? 'email' : 'off');
        const im = f.type === 'tel' ? ' inputmode="tel"' : f.type === 'email' ? ' inputmode="email"' : '';
        return '<div>' +
          '<label for="f_' + id + '" class="block mb-1 text-sm font-medium text-slate-900">' + labelHtml(f) + '</label>' +
          '<input id="f_' + id + '" data-id="' + id + '" type="' + f.type + '"' + im + ' autocomplete="' + esc(ac) + '" placeholder="' + esc(f.placeholder || '') + '" class="' + INPUT_CLS + '">' +
          '<p data-err="' + id + '" class="hidden mt-1 text-sm text-red-700"></p></div>';
      }
      case 'textarea':
        return '<div>' +
          '<label for="f_' + id + '" class="block mb-1 text-sm font-medium text-slate-900">' + labelHtml(f) + '</label>' +
          '<textarea id="f_' + id + '" data-id="' + id + '" rows="3" placeholder="' + esc(f.placeholder || '') + '" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-base text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600"></textarea>' +
          '<p data-err="' + id + '" class="hidden mt-1 text-sm text-red-700"></p></div>';

      case 'checkbox':
        return '<label class="card flex items-start gap-3 p-3">' +
          '<input type="checkbox" data-id="' + id + '" class="mt-0.5 h-5 w-5 shrink-0 accent-blue-600">' +
          '<span class="flex-1 min-w-0"><span class="block text-base text-slate-900">' + esc(f.label) + '</span>' + hintHtml(f) + '</span>' +
          '<span class="text-base font-medium text-slate-900 whitespace-nowrap">' + esc(money(f.price || 0)) + '</span>' +
          '</label>';

      case 'number': {
        const price = f.price
          ? '<span class="text-sm text-slate-600 whitespace-nowrap">' + esc(money(f.price)) + (f.unit ? ' / ' + esc(f.unit) : '') + '</span>' : '';
        const btn = 'h-12 w-12 shrink-0 rounded-lg border border-slate-300 bg-white text-xl leading-none text-slate-900 hover:bg-slate-50 active:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600';
        return '<div class="p-3 border border-slate-300 rounded-lg bg-white">' +
          '<div class="flex items-start justify-between gap-3">' +
          '<label for="f_' + id + '" class="min-w-0"><span class="block text-base text-slate-900">' + esc(f.label) + '</span>' + hintHtml(f) + '</label>' + price + '</div>' +
          '<div class="mt-3 flex items-stretch gap-2">' +
          '<button type="button" data-step="-1" data-for="' + id + '" aria-label="' + esc(L.dec) + '" class="' + btn + '">\u2212</button>' +
          '<div class="relative flex-1">' +
          '<input id="f_' + id + '" data-id="' + id + '" type="text" inputmode="decimal" autocomplete="off" placeholder="0" class="' + INPUT_CLS + ' text-center px-12">' +
          (f.unit ? '<span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-slate-500 pointer-events-none">' + esc(f.unit) + '</span>' : '') +
          '</div>' +
          '<button type="button" data-step="1" data-for="' + id + '" aria-label="' + esc(L.inc) + '" class="' + btn + '">+</button>' +
          '</div></div>';
      }

      case 'select': {
        const head = '<span class="block mb-1 text-sm font-medium text-slate-900">' + esc(f.label) + '</span>' + hintHtml(f);
        if (f.ui === 'segmented') {
          const items = f.options.map((o) => {
            const eff = effectText(o);
            return '<label><input type="radio" name="r_' + id + '" data-id="' + id + '" value="' + esc(o.value) + '">' +
              '<span class="seg-item">' + esc(o.label) + (eff ? '<small>' + esc(eff) + '</small>' : '') + '</span></label>';
          }).join('');
          return '<div role="radiogroup" aria-label="' + esc(f.label) + '">' + head + '<div class="seg">' + items + '</div></div>';
        }
        const opts = f.options.map((o) => {
          const eff = effectText(o);
          return '<option value="' + esc(o.value) + '">' + esc(o.label) + (eff ? ' (' + esc(eff) + ')' : '') + '</option>';
        }).join('');
        return '<div><label for="f_' + id + '">' + head + '</label>' +
          '<select id="f_' + id + '" data-id="' + id + '" class="' + INPUT_CLS + '">' + opts + '</select></div>';
      }

      case 'switch': {
        const eff = effectText(f);
        return '<label class="card flex items-center gap-3 p-3">' +
          '<span class="flex-1 min-w-0"><span class="block text-base text-slate-900">' + esc(f.label) + '</span>' + hintHtml(f) + '</span>' +
          (eff ? '<span class="text-sm font-medium text-slate-700 whitespace-nowrap">' + esc(eff) + '</span>' : '') +
          '<input type="checkbox" data-id="' + id + '" class="sw"><span class="sw-track"></span>' +
          '</label>';
      }
      default:
        return '';
    }
  }

  function renderForm() {
    $('form').innerHTML = CFG.sections.map((s) =>
      '<section class="py-5 border-b border-slate-200">' +
      '<h2 class="text-lg font-semibold">' + esc(s.title) + '</h2>' +
      (s.description ? '<p class="mt-1 text-sm text-slate-600">' + esc(s.description) + '</p>' : '') +
      '<div class="mt-4 space-y-3">' + s.fields.map(renderField).join('') + '</div></section>'
    ).join('');

    els = {};
    $('form').querySelectorAll('[data-id]').forEach((el) => {
      (els[el.dataset.id] = els[el.dataset.id] || []).push(el);
    });
  }

  function applyToDOM() {
    Object.keys(FIELDS).forEach((id) => {
      (els[id] || []).forEach((el) => {
        if (el.type === 'checkbox') el.checked = !!state[id];
        else if (el.type === 'radio') el.checked = el.value === state[id];
        else el.value = state[id];
      });
    });
  }

  /* ---------- Рендер расчёта ---------- */
  function row(label, detail, amountText, strong) {
    return '<div class="flex items-start justify-between gap-3 py-2 border-b border-slate-200 last:border-b-0">' +
      '<div class="min-w-0"><div class="text-sm ' + (strong ? 'font-semibold' : '') + ' text-slate-900">' + esc(label) + '</div>' +
      (detail ? '<div class="text-xs text-slate-500">' + esc(detail) + '</div>' : '') + '</div>' +
      '<div class="text-sm ' + (strong ? 'font-semibold' : 'font-medium') + ' text-slate-900 whitespace-nowrap">' + esc(amountText) + '</div></div>';
  }

  function renderCalc(r) {
    const box = $('calcBody');
    if (!r.active) {
      box.innerHTML = '<p class="text-sm text-slate-600">' + esc(L.emptyCalc) + '</p>';
      return;
    }
    let h = '';
    r.lines.forEach((l) => { h += row(l.label, l.detail, money(l.amount)); });
    if (r.mods.length || r.tax) {
      h += row(L.base, '', money(r.base), true);
      r.mods.forEach((m) => { h += row(m.label, m.detail, m.amount ? signed(m.amount) : ''); });
      if (r.tax) h += row(taxLabel(), '', CFG.tax.included ? money(r.tax) : signed(r.tax));
    }
    h += '<div class="flex items-baseline justify-between pt-3 mt-1 border-t border-slate-300">' +
      '<span class="text-base font-semibold">' + esc(L.total) + '</span>' +
      '<span class="text-lg font-bold">' + esc(money(r.total)) + '</span></div>';
    box.innerHTML = h;
  }

  function fitSpacer() {
    $('spacer').style.height = ($('bar').offsetHeight + 16) + 'px';
  }

  function update() {
    const r = calculate();
    renderCalc(r);
    $('barTotal').textContent = money(r.total);
    fitSpacer();
    return r;
  }

  /* ---------- Ошибки и сообщения ---------- */
  function showError(id, text) {
    const p = document.querySelector('[data-err="' + id + '"]');
    const el = (els[id] || [])[0];
    if (p) { p.textContent = text; p.classList.remove('hidden'); }
    if (el) { el.classList.remove('border-slate-300'); el.classList.add('border-red-700'); }
  }
  function clearError(id) {
    const p = document.querySelector('[data-err="' + id + '"]');
    const el = (els[id] || [])[0];
    if (p) p.classList.add('hidden');
    if (el && el.classList.contains('border-red-700')) { el.classList.remove('border-red-700'); el.classList.add('border-slate-300'); }
  }
  let msgTimer = null;
  function showMsg(text) {
    const m = $('msg');
    m.textContent = text;
    m.classList.remove('hidden');
    fitSpacer();
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { m.classList.add('hidden'); fitSpacer(); }, 5000);
  }

  function validate() {
    let first = null;
    Object.keys(FIELDS).forEach((id) => {
      const f = FIELDS[id];
      if (!isInfo(f)) return;
      const v = String(state[id]).trim();
      clearError(id);
      let err = '';
      if (f.required && !v) err = L.required;
      else if (f.type === 'tel' && v && v.replace(/\D/g, '').length < 6) err = L.badPhone;
      if (err) {
        showError(id, err);
        if (!first) first = id;
      }
    });
    if (first) {
      const el = els[first][0];
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      try { el.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    }
    return !first;
  }

  /* ---------- Итоговый документ ---------- */
  function isoToRu(v) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
    return m ? m[3] + '.' + m[2] + '.' + m[1] : v;
  }

  function buildDocument(r) {
    const D = CFG.document || {};
    const now = new Date();
    const num_ = (D.numberPrefix || '') + pad(now.getFullYear() % 100) + pad(now.getMonth() + 1) + pad(now.getDate()) + '-' + pad(now.getHours()) + pad(now.getMinutes());
    const out = [];
    out.push((D.title || '') + ' \u2116 ' + num_);
    out.push(L.date + ': ' + pad(now.getDate()) + '.' + pad(now.getMonth() + 1) + '.' + now.getFullYear());
    (D.provider || []).forEach((x) => out.push(x));
    if (D.intro) out.push('', D.intro);

    CFG.sections.forEach((s) => {
      const infos = s.fields.filter(isInfo)
        .map((f) => [f, String(state[f.id]).trim()])
        .filter((x) => x[1]);
      if (infos.length) {
        out.push('', (s.docTitle || s.title).toUpperCase());
        infos.forEach((x) => out.push(x[0].label + ': ' + (x[0].type === 'date' ? isoToRu(x[1]) : x[1])));
      }
    });

    let n = 0;
    CFG.sections.forEach((s) => {
      const ls = r.lines.filter((l) => l.section === s.id);
      if (!ls.length) return;
      out.push('', (s.docTitle || s.title).toUpperCase());
      ls.forEach((l) => {
        n += 1;
        out.push(n + '. ' + l.label);
        out.push('    ' + (l.detail ? l.detail + ' = ' : '') + money(l.amount));
      });
    });

    if (r.mods.length) {
      out.push('', L.adjustments.toUpperCase());
      r.mods.forEach((m) => {
        out.push('\u2022 ' + m.label + (m.detail ? ' (' + m.detail + ')' : '') + (m.amount ? ': ' + signed(m.amount) : ''));
      });
    }

    out.push('', '--------------------------');
    if (r.mods.length || r.tax) out.push(L.base + ': ' + money(r.base));
    if (r.tax) out.push(taxLabel() + ': ' + (CFG.tax.included ? money(r.tax) : signed(r.tax)));
    out.push(L.total.toUpperCase() + ': ' + money(r.total));

    if ((D.footer || []).length) {
      out.push('');
      D.footer.forEach((x) => out.push(x));
    }
    return out.join('\n');
  }

  /* ---------- Окно документа ---------- */
  function setModal(open) {
    const m = $('docModal');
    m.classList.toggle('hidden', !open);
    m.classList.toggle('flex', open);
    document.body.classList.toggle('overflow-hidden', open);
  }

  async function copyText(t) {
    try {
      await navigator.clipboard.writeText(t);
      return true;
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = t;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
      ta.remove();
      return ok;
    }
  }

  function generate() {
    const r = calculate();
    if (!validate()) { showMsg(L.fixErrors); return; }
    if (!r.active) { showMsg(L.needItems); return; }
    $('docText').textContent = buildDocument(r);
    setModal(true);
    $('docText').parentElement.scrollTop = 0;
  }

  /* ---------- События ---------- */
  function onFieldChange(e) {
    const el = e.target;
    const id = el.dataset && el.dataset.id;
    if (!id || !FIELDS[id]) return;
    const f = FIELDS[id];
    if (el.type === 'radio' && !el.checked) return;
    if (f.type === 'number') el.value = el.value.replace(/[^\d.,]/g, '');
    state[id] = (el.type === 'checkbox') ? el.checked : el.value;
    clearError(id);
    saveState();
    update();
  }

  function stepNumber(id, dir) {
    const f = FIELDS[id];
    const input = els[id][0];
    const step = f.step || 1;
    let next = round2(parseNum(input.value) + dir * step);
    if (next < 0) next = 0;
    if (dir > 0 && f.min != null && next > 0 && next < f.min) next = f.min;
    if (f.max != null && next > f.max) next = f.max;
    input.value = next === 0 ? '' : String(next);
    state[id] = input.value;
    saveState();
    update();
  }

  function init() {
    document.title = CFG.title;
    $('appTitle').textContent = CFG.title;
    $('appSubtitle').textContent = CFG.subtitle || '';
    $('appSubtitle').classList.toggle('hidden', !CFG.subtitle);
    $('resetBtn').textContent = L.reset;
    $('calcTitle').textContent = L.calcTitle;
    $('barLabel').textContent = L.total;
    $('genBtn').textContent = L.generate;
    $('docHeading').textContent = L.docPreview;
    $('docClose').textContent = L.close;
    $('docCopy').textContent = L.copy;
    $('docShare').textContent = L.share;

    renderForm();
    applyToDOM();
    update();

    const form = $('form');
    form.addEventListener('submit', (e) => e.preventDefault());
    form.addEventListener('input', onFieldChange);
    form.addEventListener('change', onFieldChange);
    form.addEventListener('click', (e) => {
      const b = e.target.closest('[data-step]');
      if (b) stepNumber(b.dataset.for, parseInt(b.dataset.step, 10));
    });
    form.addEventListener('focusout', (e) => {
      const el = e.target;
      const id = el.dataset && el.dataset.id;
      if (!id || !FIELDS[id] || FIELDS[id].type !== 'number') return;
      const q = qtyOf(FIELDS[id]);
      el.value = q === 0 ? '' : String(q);
      state[id] = el.value;
      saveState();
      update();
    });

    $('genBtn').addEventListener('click', generate);
    $('docClose').addEventListener('click', () => setModal(false));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setModal(false); });

    $('docCopy').addEventListener('click', async () => {
      const ok = await copyText($('docText').textContent);
      const b = $('docCopy');
      b.textContent = ok ? L.copied : L.copyFail;
      setTimeout(() => { b.textContent = L.copy; }, 1800);
    });

    if (navigator.share) {
      $('docShare').classList.remove('hidden');
      $('docShare').addEventListener('click', () => {
        navigator.share({ title: CFG.title, text: $('docText').textContent }).catch(() => {});
      });
    }

    $('resetBtn').addEventListener('click', () => {
      if (!window.confirm(L.resetConfirm)) return;
      Object.keys(FIELDS).forEach((id) => { state[id] = defaultValue(FIELDS[id]); clearError(id); });
      try { localStorage.removeItem(CFG.storageKey); } catch (e) { /* ignore */ }
      applyToDOM();
      update();
    });

    window.addEventListener('resize', fitSpacer);
  }

  init();
})();
</script>
</body>
</html>
